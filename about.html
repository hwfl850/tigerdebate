<script>
function onSiteReady() {
  const main = document.getElementById('main-content');
  const c = currentContent();
  const ab = c.about || {};

  const instagramHandle = ab.instagramHandle || 'tigerdebate';
  const instagramUrl = 'https://www.instagram.com/' + instagramHandle;

  // Update nav Instagram link dynamically
  const navInsta = document.querySelector('nav a.nav-accent');
  if (navInsta) navInsta.href = instagramUrl;

  // Update footer Instagram link dynamically
  const footerInsta = document.getElementById('footer-insta');
  if (footerInsta) footerInsta.href = instagramUrl;

  main.innerHTML = `
    <div class="hero" style="padding:4rem 1.5rem 3.5rem;">
      <div class="hero-content">
        <div class="hero-eyebrow">${escHtml(ab.heroEyebrow || 'About Us')}</div>
        <h1>${escHtml(ab.heroHeading || 'Built by Debaters, For Debaters')}</h1>
        <p>${escHtml(ab.heroBody || 'Tiger Debate Camp was founded at Pensacola High School to give rising middle schoolers the same skills that high school debate competitors spend years developing — compressed into five powerful days.')}</p>
      </div>
    </div>

    <div class="mission-strip">
      <div class="motto">${escHtml(ab.mottoText || '"In Utramque Partem"')}</div>
      <div class="motto-latin">${escHtml(ab.mottoSub || 'On Both Sides · The motto of Tiger Debate Camp')}</div>
    </div>

    <section class="section">
      <div class="section-inner">
        <div class="section-eyebrow">${escHtml(ab.founderEyebrow || 'The Founder')}</div>
        <h2 class="section-title">${escHtml(ab.founderHeading || 'Meet Henry White')}</h2>
        <div class="section-line"></div>
        <div class="about-founder">

          <div class="about-founder-info">
            <h3>${escHtml(ab.founderName || 'Henry White')}</h3>
            <div class="role-tag">${escHtml(ab.founderRole || 'Founder &amp; Director · Pensacola High School')}</div>
            <p>${escHtml(ab.founderBio1 || 'Henry White is a competitive debater at Pensacola High School and the founder of Tiger Debate Camp. Drawing on his own experience in high school debate, Henry created the camp to open the world of structured argumentation to younger students. He designed the Tiger Debate Format to give beginners a competitive framework that is rigorous enough to teach real skills while accessible enough for first-time competitors.')}</p>
            ${ab.founderBio2 ? `<p style="margin-top:.85rem;">${escHtml(ab.founderBio2)}</p>` : ''}
          </div>
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="section-inner">
        <div class="section-eyebrow">The School</div>
        <h2 class="section-title">Pensacola High School</h2>
        <div class="section-line"></div>
        <div class="cards">
          <div class="card">
            <div class="card-icon">
              <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>

          <div class="card">
            <div class="card-icon">
              <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </div>
            <h3>23 Campers in 2026</h3>
            <p>Rising 6th, 7th, and 8th graders from the Pensacola area. No prior debate experience required — just a willingness to argue.</p>
          </div>
          <div class="card">
            <div class="card-icon">
              <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h3>The Tiger Debate Format</h3>
            <p>A specialized, beginner-friendly debate format created for the camp — balanced, structured, and designed to develop real competitive skills fast.</p>
          </div>
        </div>
      </div>
    </section>

        <p style="color:var(--text-muted);max-width:520px;margin:0 auto 1.75rem;line-height:1.7;">
          Stay up to date with Tiger Debate Camp news, event announcements, and results by following us on Instagram.
        </p>
        <a class="btn btn-primary" href="${escHtml(instagramUrl)}" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">

          </svg>

        </a>
